<!DOCTYPE html>
<html lang="fr-FR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/main.js" type="module"></script>
    <title>Exo Eval JS</title>
  </head>
  <body>
    <div class="container">
      <h1>Créer votre compte</h1>
      <div class="form">
        <form>
          <div class="form-row">
            <label for="username">Nom d'utilisateur</label>
            <input
              type="text"
              id="username"
              class="couleurs"
              placeholder="Nom d'utilisateur"
            />
          </div>

          <div class="form-row">
            <label for="password">Mot de passe</label>
            <input
              type="password"
              id="password"
              class="couleurs"
              placeholder="Mot de passe"
            />
          </div>

          <div class="form-row">
            <label for="confirmPassword">Confirmer le mot de passe</label>
            <input
              type="password"
              id="confirmPassword"
              class="couleurs"
              placeholder="Mot de passe (confirmer)"
            />
          </div>
          <button type="submit" class="couleurs">Suivant</button>
          <p class="texte_erreur"></p>
        </form>
      </div>
      
    </div>

    <footer>
      <p>Copyright © 2025 Prénom Nom</p>
    </footer>
  </body>
</html>
